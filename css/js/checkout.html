<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bloxypay | Checkout</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="navbar">

    <div class="logo">
        Bloxypay
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="index.html#games">Games</a>
    </nav>

    <button
        class="cart-button"
        onclick="openCart()">

        🛒 Cart

    </button>

</header>


<main>

    <section class="checkout-page">

        <div class="section-heading">

            <p class="purple-text">
                BLOXYPAY
            </p>

            <h1>
                Checkout
            </h1>

            <p>
                Review your order before continuing.
            </p>

        </div>


        <div class="checkout-layout">


            <!-- ORDER -->

            <div class="checkout-box">

                <h2>
                    Your Order
                </h2>

                <div id="checkout-items"></div>

                <div class="checkout-total">

                    <span>
                        Total
                    </span>

                    <strong id="checkout-total">
                        $0.00
                    </strong>

                </div>

            </div>


            <!-- CUSTOMER INFO -->

            <div class="checkout-box">

                <h2>
                    Customer Information
                </h2>

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="customer-email"
                    placeholder="you@example.com">

                <p class="checkout-note">
                    Your order information will be associated
                    with this email.
                </p>


                <button
                    class="primary-button checkout-button"
                    onclick="startPayment()">

                    Continue to Secure Payment →

                </button>

            </div>

        </div>

    </section>

</main>


<footer>

    <div class="footer-logo">
        Bloxypay
    </div>

    <p>
        © 2026 Bloxypay. All rights reserved.
    </p>

</footer>


<script src="js/app.js"></script>

</body>

</html>
