<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bloxypay | Product</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">Bloxypay</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="index.html#games">Games</a>
        <a href="#support">Support</a>
    </nav>

    <button class="cart-button" onclick="openCart()">
        🛒 Cart
    </button>

</header>


<main>

    <section class="product-page">

        <div class="product-large-image">
            🧠
        </div>

        <div class="product-details">

            <span id="product-game">
                STEAL A BRAINROT
            </span>

            <h1 id="product-name">
                Example Brainrot
            </h1>

            <p id="product-description">
                This is an example Bloxypay product.
                Product information will be added here.
            </p>

            <div class="stock">
                Stock: <strong id="product-stock">5</strong>
            </div>

            <div class="price" id="product-price">
                $4.99
            </div>

            <button
                class="primary-button"
                onclick="addCurrentProduct()">
                Add to Cart
            </button>

        </div>

    </section>

</main>


<footer>

    <div class="footer-logo">
        Bloxypay
    </div>

    <p>
        © 2026 Bloxypay. All rights reserved.
    </p>

</footer>


<script src="js/app.js"></script>

</body>
</html>
