<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bloxypay | Steal a Brainrot</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">Bloxypay</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="index.html#games">Games</a>
        <a href="#support">Support</a>
    </nav>

    <button class="cart-button" onclick="openCart()">
        🛒 Cart
    </button>

</header>


<main>

    <section class="shop-header">

        <p class="purple-text">
            BLOXYPAY GAME STORE
        </p>

        <h1>🧠 Steal a Brainrot</h1>

        <p>
            Browse available items.
        </p>

    </section>


    <section class="section">

        <div class="product-grid">


            <div class="product-card">

                <div class="product-image">
                    🧠
                </div>

                <div class="product-info">

                    <span>STEAL A BRAINROT</span>

                    <h3>Example Brainrot</h3>

                    <p class="rarity">
                        Rarity: Example
                    </p>

                    <div class="product-bottom">

                        <strong>$4.99</strong>

                        <button
                            onclick="addToCart('Example Brainrot', 4.99)">

                            Add

                        </button>

                    </div>

                </div>

            </div>


            <div class="product-card">

                <div class="product-image">
                    🧠
                </div>

                <div class="product-info">

                    <span>STEAL A BRAINROT</span>

                    <h3>Example Brainrot 2</h3>

                    <p class="rarity">
                        Rarity: Example
                    </p>

                    <div class="product-bottom">

                        <strong>$7.99</strong>

                        <button
                            onclick="addToCart('Example Brainrot 2', 7.99)">

                            Add

                        </button>

                    </div>

                </div>

            </div>


        </div>

    </section>

</main>


<footer>

    <div class="footer-logo">
        Bloxypay
    </div>

    <p>
        © 2026 Bloxypay. All rights reserved.
    </p>

</footer>


<script src="js/app.js"></script>

</body>
</html>
